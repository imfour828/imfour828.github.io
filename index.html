<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tứ | Personal Bio</title>
    <!-- FontAwesome Font for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-hover: rgba(51, 65, 85, 0.8);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        /* Avatar Section */
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .tagline {
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bio-text {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
            padding: 0 10px;
        }

        /* Links Section */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
        }

        .link-card:hover {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-content i {
            font-size: 1.3rem;
            color: var(--accent);
            width: 24px;
        }

        .link-title {
            font-weight: 600;
            font-size: 1rem;
        }

        .arrow {
            color: var(--text-sub);
            font-size: 0.8rem;
        }

        /* Footer */
        footer {
            margin-top: 32px;
            color: var(--text-sub);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ảnh đại diện -->
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Four" alt="Avatar" class="profile-img">
        
        <!-- Tên & Bio -->
        <h1>Tứ (Four) 👋</h1>
        <div class="tagline">Developer & Content Creator</div>
        <p class="bio-text">
            Thích lập trình, mày mò công nghệ & làm những dự án thú vị. Luôn giữ tinh thần học hỏi và chill! ☕✨
        </p>

        <!-- Danh sách liên kết (Links) -->
        <div class="links">
            
            <a href="https://discord.gg/your-invite-code" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-discord"></i>
                    <span class="link-title">Chill House Discord</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <a href="https://github.com/your-username" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-github"></i>
                    <span class="link-title">GitHub Profile</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <a href="https://tiktok.com/@your-username" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-tiktok"></i>
                    <span class="link-title">TikTok Channel</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <a href="mailto:your-email@gmail.com" class="link-card">
                <div class="link-content">
                    <i class="fa-solid fa-envelope"></i>
                    <span class="link-title">Gửi Email Liên Hệ</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

        </div>

        <footer>
            © 2026 Tứ. Hosted on GitHub Pages.
        </footer>
    </div>

</body>
</html>
