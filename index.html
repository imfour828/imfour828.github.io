<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Bio Portal</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Vanilla Tilt.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <!-- =========================================================
         ⚙ KHU VỰC CẤU HÌNH THÔNG TIN (CONFIG)
         ========================================================= -->
    <script>
        const CONFIG = {
            // 1. Thông tin cá nhân
            NAME: "Tứ (Four) 👋",
            BIO: "Thích lập trình, mày mò công nghệ & làm những dự án thú vị. Luôn giữ tinh thần học hỏi và chill! ☕✨",
            TYPING_WORDS: ["DEVELOPER", "CONTENT CREATOR", "CHILL HOUSE OWNER", "TECH ENTHUSIAST"],
            
            // 2. Hình ảnh
            AVATAR_URL: "https://api.dicebear.com/7.x/bottts/svg?seed=Four",
            BANNER_URL: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop",

            // 3. Discord
            DISCORD_USER_ID: "YOUR_DISCORD_USER_ID", 
            DISCORD_SERVER_ID: "1551278529604231308",

            // 4. Nhạc nền (Tệp MP3 nội bộ)
            SONG_TITLE: "Còn Gì Đẹp Hơn 🎵",
            LOFI_STREAM_URL: "./congidephon.mp3",

            // 5. Danh sách các nút Link
            LINKS: [
                {
                    title: "Chill House Discord",
                    icon: "fa-brands fa-discord",
                    url: "https://discord.gg/your-invite-code",
                    type: "link",
                    tag: "Tham gia"
                },
                {
                    title: "GitHub Profile",
                    icon: "fa-brands fa-github",
                    url: "https://github.com/your-username",
                    type: "link",
                    tag: "Ghé thăm"
                },
                {
                    title: "TikTok Channel",
                    icon: "fa-brands fa-tiktok",
                    url: "https://tiktok.com/@your-username",
                    type: "link",
                    tag: "Xem Clip"
                },
                {
                    title: "Copy Discord Username",
                    icon: "fa-solid fa-copy",
                    valueToCopy: "four_dev",
                    toastMessage: "Đã copy Discord Username!",
                    type: "copy",
                    tag: "Copy ID"
                },
                {
                    title: "Gửi Email Liên Hệ",
                    icon: "fa-solid fa-envelope",
                    url: "mailto:your-email@gmail.com",
                    type: "link",
                    tag: "Gửi Mail"
                }
            ]
        };
    </script>

    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(15, 23, 42, 0.7);
            --card-hover: rgba(30, 41, 59, 0.9);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-purple: #a855f7;
            --border: rgba(255, 255, 255, 0.1);
            --online: #22c55e;
            --idle: #eab308;
            --dnd: #ef4444;
            --offline: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: var(--bg-color);
        }

        body {
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(168, 85, 247, 0.15) 0%, transparent 45%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            z-index: 1;
            background: rgba(13, 18, 30, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            padding-bottom: 24px;
        }

        .banner-cover {
            width: 100%;
            height: 130px;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
        }

        .banner-cover::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(13, 18, 30, 1), transparent);
        }

        .avatar-container {
            position: relative;
            margin: -50px auto 12px auto;
            display: inline-block;
        }

        .avatar-ring {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent), var(--accent-purple), #ec4899, var(--accent));
            background-size: 300% 300%;
            animation: spin-gradient 4s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        @keyframes spin-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .profile-img {
            width: 102px;
            height: 102px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0d121e;
            display: block;
            background-color: #1a2332;
        }

        .status-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 3px solid #0d121e;
            background-color: var(--offline);
            z-index: 3;
            transition: background-color 0.3s ease;
        }

        .content-box {
            padding: 0 16px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #fff 40%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline-box {
            height: 22px;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tagline {
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-right: 2px solid var(--accent);
            white-space: nowrap;
            overflow: hidden;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: var(--accent); }
        }

        .music-inline-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            gap: 6px;
            cursor: pointer;
        }

        .song-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: #38bdf8;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .wave-box {
            display: flex;
            gap: 3px;
            align-items: flex-end;
            height: 14px;
        }

        .wave-bar {
            width: 3px;
            height: 3px;
            background: #ff4757;
            border-radius: 2px;
            opacity: 0.3;
        }

        .playing .wave-bar {
            opacity: 1;
            animation: wave 1.2s ease-in-out infinite;
        }

        .playing .wave-bar:nth-child(1) { animation-delay: 0.1s; }
        .playing .wave-bar:nth-child(2) { animation-delay: 0.3s; }
        .playing .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .playing .wave-bar:nth-child(4) { animation-delay: 0.5s; }
        .playing .wave-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { height: 3px; }
            50% { height: 14px; }
        }

        .bio-text {
            color: var(--text-sub);
            font-size: 0.88rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .link-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .link-card:hover {
            background: var(--card-hover);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-icon {
            font-size: 1.2rem;
            color: var(--accent);
            width: 22px;
            display: flex;
            justify-content: center;
        }

        .link-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .action-tag {
            font-size: 0.7rem;
            color: var(--text-sub);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .discord-widget-box {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.5);
            margin-top: 10px;
        }

        .discord-widget-box iframe {
            width: 100%;
            height: 360px;
            border: none;
            display: block;
        }

        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10000;
            white-space: nowrap;
            pointer-events: none;
        }

        .toast.show {
            bottom: 25px;
        }

        #mc-heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        
        .mc-heart {
            position: absolute;
            top: -30px;
            pointer-events: none;
            image-rendering: pixelated;
            animation: mc-heart-fall linear infinite;
        }

        @keyframes mc-heart-fall {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0.9; }
            50% { transform: translateY(50vh) scale(1.1) rotate(5deg); }
            100% { transform: translateY(105vh) scale(0.9) rotate(-5deg); opacity: 0.2; }
        }

        footer {
            margin-top: 20px;
            color: var(--text-sub);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Banner Ảnh bìa -->
        <div class="banner-cover" id="banner-img"></div>

        <div class="content-box">
            <!-- Avatar Section -->
            <div class="avatar-container">
                <div class="avatar-ring">
                    <img id="avatar-img" src="" alt="Avatar" class="profile-img">
                </div>
                <div id="discord-status" class="status-badge" title="Discord Status"></div>
            </div>
            
            <!-- Header -->
            <h1 id="user-name"></h1>
            <div class="tagline-box">
                <span class="tagline" id="typing-text"></span>
            </div>

            <!-- TÊN NHẠC VÀ SÓNG NHẠC -->
            <div class="music-inline-container" id="music-toggle" title="Bấm để Bật/Tắt nhạc">
                <div class="song-name" id="song-name-text">🎵 Còn Gì Đẹp Hơn</div>
                <div class="wave-box" id="wave-visualizer">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
            </div>

            <p class="bio-text" id="user-bio"></p>

            <!-- Container danh sách các nút Link -->
            <div class="links" id="links-container"></div>

            <!-- Khung Discord Server Widget -->
            <div class="discord-widget-box js-tilt" data-tilt data-tilt-max="3">
                <iframe id="discord-widget-iframe" src="" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
            </div>

            <footer>
                © 2026 Designed with ✨ & Hosted on GitHub.
            </footer>
        </div>
    </div>

    <!-- AUDIO ẨN -->
    <audio id="bg-audio" loop preload="auto"></audio>

    <!-- Toast Notification Popup -->
    <div id="toast" class="toast">Đã copy thành công!</div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('user-name').innerText = CONFIG.NAME || "My Name";
            document.getElementById('user-bio').innerText = CONFIG.BIO || "";
            document.getElementById('avatar-img').src = CONFIG.AVATAR_URL || "";
            if (CONFIG.BANNER_URL) {
                document.getElementById('banner-img').style.backgroundImage = `url('${CONFIG.BANNER_URL}')`;
            }
            
            const audio = document.getElementById('bg-audio');
            const waveVisualizer = document.getElementById('wave-visualizer');
            if (CONFIG.SONG_TITLE) {
                document.getElementById('song-name-text').innerText = CONFIG.SONG_TITLE;
            }
            if (CONFIG.LOFI_STREAM_URL) {
                audio.src = CONFIG.LOFI_STREAM_URL;
            }

            // Hàm tự động phát nhạc
            function playMusic() {
                if (!audio.src) return;
                audio.play().then(() => {
                    waveVisualizer.classList.add('playing');
                }).catch(err => {
                    console.log("Trình duyệt chặn autoplay, chờ người dùng tương tác:", err);
                });
            }

            // Thử phát ngay lập tức
            playMusic();

            // Tự kích hoạt khi có bất kỳ thao tác click nào vào trang
            const playOnInteraction = () => {
                if (audio.paused && audio.src) {
                    playMusic();
                }
                document.removeEventListener('click', playOnInteraction);
                document.removeEventListener('touchstart', playOnInteraction);
            };

            document.addEventListener('click', playOnInteraction);
            document.addEventListener('touchstart', playOnInteraction);

            // Bấm trực tiếp vào khối tên nhạc để Bật/Tắt
            document.getElementById('music-toggle').addEventListener('click', (e) => {
                e.stopPropagation();
                if (audio.paused) {
                    audio.play();
                    waveVisualizer.classList.add('playing');
                } else {
                    audio.pause();
                    waveVisualizer.classList.remove('playing');
                }
            });

            if (CONFIG.DISCORD_SERVER_ID) {
                document.getElementById('discord-widget-iframe').src = `https://discord.com/widget?id=${CONFIG.DISCORD_SERVER_ID}&theme=dark`;
            }

            const container = document.getElementById('links-container');
            if (CONFIG.LINKS && CONFIG.LINKS.length > 0) {
                container.innerHTML = CONFIG.LINKS.map(item => {
                    if (item.type === 'copy') {
                        return `
                            <div class="link-card js-tilt" data-tilt data-tilt-max="5" onclick="copyToClipboard('${item.valueToCopy}', '${item.toastMessage}')">
                                <div class="link-left">
                                    <i class="${item.icon} link-icon"></i>
                                    <span class="link-title">${item.title}</span>
                                </div>
                                <span class="action-tag">${item.tag}</span>
                            </div>
                        `;
                    } else {
                        return `
                            <a href="${item.url}" target="_blank" class="link-card js-tilt" data-tilt data-tilt-max="5">
                                <div class="link-left">
                                    <i class="${item.icon} link-icon"></i>
                                    <span class="link-title">${item.title}</span>
                                </div>
                                <span class="action-tag">${item.tag}</span>
                            </a>
                        `;
                    }
                }).join('');
            }

            if (typeof VanillaTilt !== 'undefined') {
                VanillaTilt.init(document.querySelectorAll(".js-tilt"));
            }

            typingEffect();
            initMinecraftHearts();
            fetchDiscordStatus();
        });

        let wordIndex = 0;
        function typingEffect() {
            let words = CONFIG.TYPING_WORDS;
            if(!words || words.length === 0) return;
            let word = words[wordIndex].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typing-text').innerHTML += word.shift();
                    setTimeout(loopTyping, 100);
                } else {
                    setTimeout(deletingEffect, 2000);
                }
            };
            loopTyping();
        }

        function deletingEffect() {
            let words = CONFIG.TYPING_WORDS;
            let currentText = document.getElementById('typing-text').innerHTML;
            if (currentText.length > 0) {
                document.getElementById('typing-text').innerHTML = currentText.substring(0, currentText.length - 1);
                setTimeout(deletingEffect, 50);
            } else {
                wordIndex = (wordIndex + 1) % words.length;
                typingEffect();
            }
        }

        function copyToClipboard(text, message) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.innerText = message || 'Đã copy thành công!';
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            }).catch(err => {
                console.error("Lỗi copy: ", err);
            });
        }

        function fetchDiscordStatus() {
            if (!CONFIG.DISCORD_USER_ID || CONFIG.DISCORD_USER_ID === "YOUR_DISCORD_USER_ID") return;
            fetch(`https://api.lanyard.rest/v1/users/${CONFIG.DISCORD_USER_ID}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.data) {
                        const status = data.data.discord_status;
                        const badge = document.getElementById('discord-status');
                        const colors = {
                            online: 'var(--online)',
                            idle: 'var(--idle)',
                            dnd: 'var(--dnd)',
                            offline: 'var(--offline)'
                        };
                        badge.style.backgroundColor = colors[status] || colors.offline;
                    }
                })
                .catch(err => console.log("Lanyard API error:", err));
        }

        function initMinecraftHearts() {
            const heartContainer = document.createElement('div');
            heartContainer.id = 'mc-heart-container';
            document.body.appendChild(heartContainer);

            const heartSVG = `
              <svg width="100%" height="100%" viewBox="0 0 9 8" fill="none" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated;">
                <path d="M2 0H4V1H2V0ZM5 0H7V1H5V0ZM1 1H2V2H1V1ZM4 1H5V2H4V1ZM7 1H8V2H7V1ZM0 2H1V5H0V2ZM8 2H9V5H8V2ZM1 5H2V6H1V5ZM7 5H8V6H7V5ZM2 6H3V7H2V6ZM6 6H7V7H6V6ZM3 7H6V8H3V7Z" fill="#000000"/>
                <path d="M2 1H4V2H5V1H7V2H8V5H7V6H6V7H3V6H2V5H1V2H2V1Z" fill="#FF0000"/>
                <path d="M2 2H3V3H2V2ZM5 2H6V3H5V2Z" fill="#FF9999"/>
              </svg>
            `;

            const heartCount = 20;

            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.className = 'mc-heart';
                heart.innerHTML = heartSVG;

                const sizes = [16, 20, 24];
                const size = sizes[Math.floor(Math.random() * sizes.length)];
                const left = Math.random() * 100;
                const duration = Math.random() * 4 + 4;
                const delay = Math.random() * 5;
                const opacity = Math.random() * 0.4 + 0.6;

                heart.style.width = `${size}px`;
                heart.style.height = `${Math.round(size * 8 / 9)}px`;
                heart.style.left = `${left}vw`;
                heart.style.animationDuration = `${duration}s`;
                heart.style.animationDelay = `${delay}s`;
                heart.style.opacity = opacity;

                heartContainer.appendChild(heart);
            }
        }
    </script>
</body>
</html>
