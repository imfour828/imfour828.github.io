            <div class="links" id="links-container"></div>

            <!-- Khung Discord Server Widget -->
            <div class="discord-widget-box js-tilt" data-tilt data-tilt-max="3">
                <iframe id="discord-widget-iframe" src="" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
            </div>

            <footer>
                © 2026 Designed with ✨ & Hosted on GitHub.
            </footer>
        </div>
    </div>

    <!-- AUDIO ẨN HOÀN TOÀN -->
    <audio id="bg-audio" loop preload="auto"></audio>

    <!-- Toast Notification Popup -->
    <div id="toast" class="toast">Đã copy thành công!</div>

    <script>
        // --- NẠP DỮ LIỆU TỪ CẤU HÌNH CONFIG ---
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('user-name').innerText = CONFIG.NAME;
            document.getElementById('user-bio').innerText = CONFIG.BIO;
            document.getElementById('avatar-img').src = CONFIG.AVATAR_URL;
            document.getElementById('banner-img').style.backgroundImage = `url('${CONFIG.BANNER_URL}')`;
            
            // Cấu hình âm thanh
            const audio = document.getElementById('bg-audio');
            const waveVisualizer = document.getElementById('wave-visualizer');
            if (CONFIG.SONG_TITLE) {
                document.getElementById('song-name-text').innerText = CONFIG.SONG_TITLE;
            }
            audio.src = CONFIG.LOFI_STREAM_URL;

            // Hàm tự động phát nhạc
            function autoPlayAudio() {
                audio.play().then(() => {
                    waveVisualizer.classList.add('playing');
                }).catch(err => {
                    console.log("Cần tương tác để phát nhạc:", err);
                });
            }

            // Kích hoạt tự phát nhạc khi load
            autoPlayAudio();

            // Chạm/Click bất kỳ đâu để phát nếu bị trình duyệt chặn
            document.addEventListener('click', () => {
                if (audio.paused) {
                    autoPlayAudio();
                }
            }, { once: true });

            // Nạp Widget Discord Server
            if (CONFIG.DISCORD_SERVER_ID) {
                document.getElementById('discord-widget-iframe').src = `https://discord.com/widget?id=${CONFIG.DISCORD_SERVER_ID}&theme=dark`;
            }

            // Render Danh sách Links
            const container = document.getElementById('links-container');
            container.innerHTML = CONFIG.LINKS.map(item => {
                if (item.type === 'copy') {
                    return `
                        <div class="link-card js-tilt" data-tilt data-tilt-max="8" onclick="copyToClipboard('${item.valueToCopy}', '${item.toastMessage}')">
                            <div class="link-left">
                                <i class="${item.icon} link-icon"></i>
                                <span class="link-title">${item.title}</span>
                            </div>
                            <span class="action-tag">${item.tag}</span>
                        </div>
                    `;
                } else {
                    return `
                        <a href="${item.url}" target="_blank" class="link-card js-tilt" data-tilt data-tilt-max="8">
                            <div class="link-left">
                                <i class="${item.icon} link-icon"></i>
                                <span class="link-title">${item.title}</span>
                            </div>
                            <span class="action-tag">${item.tag}</span>
                        </a>
                    `;
                }
            }).join('');

            VanillaTilt.init(document.querySelectorAll(".js-tilt"));
            typingEffect();
            initMinecraftHearts();
        });

        // --- Typing Effect ---
        let wordIndex = 0, timer;
        function typingEffect() {
            let words = CONFIG.TYPING_WORDS;
            if(!words || words.length === 0) return;
            let word = words[wordIndex].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typing-text').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2000);
                    return false;
                }
                timer = setTimeout(loopTyping, 100);
            };
            loopTyping();
        }

        function deletingEffect() {
            let words = CONFIG.TYPING_WORDS;
            let currentText = document.getElementById('typing-text').innerHTML;
            if (currentText.length > 0) {
                document.getElementById('typing-text').innerHTML = currentText.substring(0, currentText.length - 1);
                setTimeout(deletingEffect, 50);
            } else {
                wordIndex = (wordIndex + 1) % words.length;
                typingEffect();
            }
        }

        // ---                if (words.length > (i + 1)) { i++; } else { i = 0; }
                    setTimeout(typingEffect, 500);
                    return false;
                }
                timer = setTimeout(loopDeleting, 50);
            };
            loopDeleting();
        }

        // --- Music Player ---
        const audio = document.getElementById('bg-audio');
        const playIcon = document.getElementById('play-icon');
        const musicCard = document.getElementById('music-card');
        const statusText = document.getElementById('status-text');

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                playIcon.className = 'fa-solid fa-pause';
                musicCard.classList.add('playing');
                statusText.innerText = 'Đang phát Lofi...';
            } else {
                audio.pause();
                playIcon.className = 'fa-solid fa-play';
                musicCard.classList.remove('playing');
                statusText.innerText = 'Đang dừng';
            }
        }

        // --- Copy Toast ---
        function copyToClipboard(text, message) {
            navigator.clipboard.writeText(text);
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }

        // --- Discord Lanyard API ---
        async function fetchDiscordStatus() {
            if (!CONFIG.DISCORD_USER_ID || CONFIG.DISCORD_USER_ID === "YOUR_DISCORD_USER_ID") return;
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${CONFIG.DISCORD_USER_ID}`);
                const data = await res.json();
                if (data.success) {
                    const status = data.data.discord_status;
                    const statusElem = document.getElementById('discord-status');
                    const colors = { online: 'var(--online)', idle: 'var(--idle)', dnd: 'var(--dnd)', offline: 'var(--offline)' };
                    statusElem.style.backgroundColor = colors[status] || colors.offline;
                }
            } catch (e) {}
        }
        setInterval(fetchDiscordStatus, 30000);

        // --- Interactive Particles Background ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = Array.from({ length: 45 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2 + 1,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4
        }));

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
                ctx.fill();

                for (let j = index + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 90) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(56, 189, 248, ${0.15 - dist/600})`;
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();
    </script>
</body>
</html>
